name: Settings save tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-save:
    name: Settings save / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use project Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # Stdlib-only, temporary saves, no desktop/GUI or dependency installs.
      # This focused check is not the full product suite or the release build.
      - name: Test settings save failure recovery
        run: python -S tests/test_config_save_atomic.py

  focused-regressions:
    env:
      PYTHONIOENCODING: utf-8
    name: Focused regressions / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use project Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install "Pillow==11.3.0" "numpy>=2,<3"
      - name: Verify tkinter import support (no window)
        run: python -c "import tkinter"
      # Headless, focused checks only; not the full product or performance suite.
      # Run these scripts directly so their main functions propagate failures.
      - name: Test cursor perception
        run: python tests/test_perception.py
      - name: Test turn continuity
        run: python tests/test_turn_continuity.py
      # Keep the full chibi timing assertions intact; CI selects only bitidentity.
      - name: Test deterministic chibi reference bitidentity
        run: python -c "import runpy; runpy.run_path('tests/test_chibi_render.py')['test_off_bitident']()"
