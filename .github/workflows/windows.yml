name: Build Windows
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test atomic settings saves (stdlib only)
        run: python -S tests/test_config_save_atomic.py
      - name: Test hidden pets across restarts (headless)
        run: python tests/test_hidden_restart_capacity.py
      - run: python tools/build_release.py
      - name: Smoke portable startup and same-id restart
        run: python tools/smoke_portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeuroPet-2D-windows
          path: |
            dist/NeuroPet-2D/
            !dist/NeuroPet-2D/**/logs/**
          retention-days: 7
          if-no-files-found: error
