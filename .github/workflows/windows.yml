name: Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/smoke.py
      - run: python tests/test_body.py
      - run: python tests/test_turn_continuity.py
      - run: python tests/test_release_cache.py
      - run: python tests/test_release_capacity.py
      - run: python tests/test_release_clock.py
      - run: python tests/test_release_memory.py
      - run: python tests/test_release_stage.py
      - run: python tests/test_compact_panel.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroPet-2D-windows
          path: dist/NeuroPet-2D/
